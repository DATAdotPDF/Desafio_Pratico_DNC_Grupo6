<svg width="960" height="540" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" overflow="hidden"><defs><clipPath id="clip0"><rect x="0" y="0" width="960" height="540"/></clipPath><clipPath id="clip1"><rect x="0" y="0" width="552450" height="542925"/></clipPath><image width="87" height="87" xlink:href="data:image/png;base64," preserveAspectRatio="none" id="img2"></image><clipPath id="clip3"><rect x="0" y="0" width="542925" height="542925"/></clipPath><clipPath id="clip4"><rect x="0" y="0" width="419100" height="142875"/></clipPath><image width="77" height="27" xlink:href="data:image/png;base64," preserveAspectRatio="none" id="img5"></image><clipPath id="clip6"><rect x="0" y="0" width="407458" height="142875"/></clipPath></defs><g clip-path="url(#clip0)"><rect x="0" y="0" width="960" height="540" fill="#0E2841"/><g clip-path="url(#clip1)" transform="matrix(0.000104987 0 0 0.000104987 13 466)"><g clip-path="url(#clip3)" transform="matrix(1.01754 0 0 1 -0.0078125 0)"><use width="100%" height="100%" xlink:href="#img2" transform="scale(6240.52 6240.52)"></use></g></g><g clip-path="url(#clip4)" transform="matrix(0.000104987 0 0 0.000104987 67 494)"><g clip-path="url(#clip6)" transform="scale(1.02857 1)"><use width="100%" height="100%" xlink:href="#img5" transform="scale(5291.67 5291.67)"></use></g></g><text fill="#40B553" fill-opacity="0.988235" font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="400" font-size="30" transform="translate(56.1001 262)">Descrição dos dados: <tspan font-size="12" x="424.5" y="158">Página 5 : Proporção nacional por Município</tspan><tspan fill="#FFFFFF" font-size="10" x="424.5" y="187">Apresenta a distribuição percentual da produção agrícola por Estado. Os dados permitem </tspan><tspan fill="#FFFFFF" font-size="10" x="424.5" y="200">comparar o desempenho dos estados em diferentes aspectos da produção</tspan><tspan fill="#FFFFFF" font-size="10" x="728.153" y="200">agrícola.</tspan><tspan font-size="12" x="424.5" y="2">Página 3 : Projeção de produção kg/he 2024 e 2025</tspan><tspan fill="#FFFFFF" font-size="10" x="424.5" y="25">Exibe projeções anuais de produção agrícola para as principais plantações com base na </tspan><tspan fill="#FFFFFF" font-size="10" x="424.5" y="38">tendência dos anos</tspan><tspan fill="#FFFFFF" font-size="10" x="504.987" y="38">anteriores.</tspan><tspan font-size="12" x="424.5" y="79">Página 4 : Proporção nacional por Estado </tspan><tspan fill="#FFFFFF" font-size="10" x="424.5" y="102">Apresenta a distribuição percentual da produção agrícola brasileira por Município, com </tspan><tspan fill="#FFFFFF" font-size="10" x="424.5" y="115">base em quatro indicadores</tspan><tspan fill="#FFFFFF" font-size="10" x="539.393" y="115">principais.</tspan><tspan font-size="12" x="424.5" y="-86">Página 2: Comparativos regionais e evolução temporal</tspan><tspan fill="#FFFFFF" font-size="10" x="424.5" y="-63">Comparações da produção agrícola por cultura, variações entre os anos (2022 e 2023) e </tspan><tspan fill="#FFFFFF" font-size="10" x="424.5" y="-50">distribuição por região do Brasil. Destaques para o valor de produção por plantação, evolução </tspan><tspan fill="#FFFFFF" font-size="10" x="424.5" y="-36">temporal por cultura e total regional</tspan><tspan font-size="12" x="424.5" y="-174">Página 1 : Produção e produtividade</tspan><tspan fill="#FFFFFF" font-size="10" x="424.5" y="-145">Apresenta indicadores gerais da produção agrícola, distribuição geográfica por município, </tspan><tspan fill="#FFFFFF" font-size="10" x="424.5" y="-132">detalhamento por cultura e ano, e comparação da produtividade média entre</tspan><tspan fill="#FFFFFF" font-size="10" x="741.22" y="-132">2022</tspan><tspan fill="#FFFFFF" font-size="10" x="763.287" y="-132">e</tspan><tspan fill="#FFFFFF" font-size="10" x="770.513" y="-132">2023</tspan></text></g></svg>